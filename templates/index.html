<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Calculator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="container">
        <h1>Smart Calculator</h1>
        <p class="description">Perform your calculations easily!</p>

        <input type="number" id="num1" placeholder="Enter First Number">
        <input type="number" id="num2" placeholder="Enter Second Number">

        <div class="buttons">
            <button type="button" onclick="calculate('add')">Addition (+)</button>
            <button type="button" onclick="calculate('subtract')">Subtraction (-)</button>
            <button type="button" onclick="calculate('multiply')">Multiplication (*)</button>
            <button type="button" onclick="calculate('divide')">Division (/)</button>
            <button type="button" onclick="clearCalculator()">Clear</button>
        </div>

        <h2>Result:</h2>
        <p id="result">Your result will appear here</p>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
